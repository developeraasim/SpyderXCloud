services:
  - type: web
    name: spyder-x-cloud-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start:api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: FIREBASE_PROJECT_ID
        value: spyderxcloud
      - key: FRONTEND_ORIGINS
        value: https://spyderxcloud.in,https://www.spyderxcloud.in
      - key: FIREBASE_ADMIN_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_APP_CHECK_ENFORCED
        value: "false"
      - key: CASHFREE_APP_ID
        sync: false
      - key: CASHFREE_SECRET_KEY
        sync: false
      - key: CASHFREE_ENV
        value: sandbox
      - key: DISCORD_ORDER_WEBHOOK_URL
        sync: false
